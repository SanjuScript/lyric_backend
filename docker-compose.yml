version: '3.8'

services:
  syncedlyrics-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncedlyrics-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    # If the app needs environment variables in the future, you can uncomment the line below:
    # env_file:
    #   - .env
